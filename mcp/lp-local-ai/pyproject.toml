[project]
name = "lp-local-ai"
version = "0.1.0"
description = "本地 AI 工具 MCP：OCR（中英）+ 本地 LLM（翻译/摘要/改写），数据不出本机"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "rapidocr>=3.9",
]

[project.scripts]
lp-local-ai = "lp_local_ai.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
